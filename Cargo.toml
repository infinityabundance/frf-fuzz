[package]
name = "frf-fuzz"
version = "0.4.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Heterogeneous residual-guided fuzzing engine: coverage + compare + residual structure + DSFB endoduction + FRF verification + Gemel longitudinal memory. One crate, two planes."
readme = "README.md"
repository = "https://github.com/infinityabundance/frf-fuzz"
keywords = ["fuzzing", "coverage", "sanitizer", "deterministic", "residual"]
categories = ["development-tools::testing", "development-tools::debugging"]
exclude = [".phase0", ".github", "docs", "scripts", "benches"]

[lints.rust]
unexpected_cfgs = { level = "warn" }

[features]
# The default build is the full coordinator (CLI + storage + scheduling +
# FRF/Gemel/DSFB-Debug integration). The instrumented fuzz target depends on
# this crate with default-features = false, features = ["target-runtime"] so
# the coordinator dependency tree is never linked into the target.
default = ["coordinator"]

# Coordinator plane: storage, scheduler, CLI, and the three optional evidence
# integrations. Every member dependency is optional so the target-runtime
# build cannot pull it in.
coordinator = [
    "dep:blake3",
    "dep:frf",
    "dep:gemel",
    "dep:dsfb-debug",
]

# Tiny target-side runtime: sancov callbacks, cmp ring, signals, crash ledger,
# deterministic mutation coordinates. Must remain dependency-light.
target-runtime = []

# Real dsfb-database integration for actual database telemetry targets only.
database = ["dep:dsfb-database"]

# Reserved: batch GPU acceleration (Phase 7). No dependencies yet; a
# feature-enabled build must still compile without CUDA hardware present.
cuda = []

# Reserved: batch GPU acceleration via HIP/ROCm (Phase 7).
rocm = []

# Reserved: allow in-process execution (no worker processes). Not for default
# use; explicit opt-in only.
dangerous-inprocess = []

[dependencies]
# Crash ledger shared mapping between coordinator and worker processes.
# memmap2 0.9.x MSRV 1.65. Required by both planes.
memmap2 = "=0.9.11"

# Worker-side Unix process controls (RLIMIT_AS memory limits; docs/
# ARCHITECTURE.md §28). libc 0.2 MSRV ~1.63, tiny, no transitive deps.
libc = "=0.2.177"

# Content identity for the coordinator-side object store (BLAKE3-256).
# gated: coordinator only. blake3 1.8.7 is the version resolved by gemel 0.11.0
# on MSRV 1.85, so the pin is proven compatible.
blake3 = { version = "=1.8.7", optional = true }

# FRF: epistemic authority. Promoted findings are court-verified here and the
# real receipt IDs retained verbatim. frf 0.1.72 declares MSRV 1.85, edition
# 2021, no features. It pulls clap/serde_yaml/tar unconditionally; that is the
# price of using the real evidence semantics, and it stays out of the
# target-runtime build.
frf = { version = "=0.1.72", optional = true }

# Gemel: longitudinal engineering memory. Durable boundaries only, never
# per-execution writes. gemel 0.11.0 declares MSRV 1.85, edition 2021, no
# features; rusqlite bundled requires a C compiler at build time.
gemel = { version = "=0.11.0", optional = true }

# DSFB-Debug: structural interpretation substrate (residual/sign/drift/slew/
# grammar/policy/episode + 205-detector field). default-features=false keeps it
# no_std with zero transitive deps; "std" enables the detector field and fusion
# layer. Its motif names are production-debugging motifs; frf-fuzz implements
# its own FuzzSemanticBank and never reuses DSFB motif names for classification.
dsfb-debug = { version = "=0.1.0", default-features = false, features = ["std"], optional = true }

# DSFB-Database: ONLY for real database telemetry targets (feature "database").
# default-features = false keeps tokio/postgres/otel/plotters out of the build.
# Generic fuzz residuals are NEVER converted into its SQL ResidualClass values.
dsfb-database = { version = "=0.1.1", default-features = false, optional = true }

[dev-dependencies]
# None in Phase 0: tests and benches are dependency-free by design.

[profile.release]
# No lto here on purpose: the *coordinator* may use LTO, but the instrumented
# fuzz-target build MUST force `-Clto=off` (RUSTFLAGS), and the coordinator
# release profile is a separate concern. See docs/COMPATIBILITY.md.

[[bin]]
name = "frf-fuzz"
path = "src/bin/frf-fuzz.rs"
# The CLI is coordinator machinery; a pure target-runtime build has no CLI.
required-features = ["coordinator"]

[[bin]]
name = "cargo-frf-fuzz"
path = "src/bin/cargo-frf-fuzz.rs"
# The cargo subcommand adapter forwards to the same library implementation.
required-features = ["coordinator"]
